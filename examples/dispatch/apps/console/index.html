<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dispatch console</title>
    <style>
      body {
        font:
          14px/1.5 system-ui,
          sans-serif;
        margin: 24px;
        color: #111;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        margin-top: 16px;
      }
      td,
      th {
        border-bottom: 1px solid #ddd;
        padding: 6px 8px;
        text-align: left;
        vertical-align: top;
      }
      code {
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Dispatch console <span id="branch"></span></h1>
    <form id="create"><input name="address" value="221B Baker St" /> <button>Dispatch a delivery</button></form>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Address</th>
          <th>Courier</th>
          <th>What happened</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
