<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>forkyard</title>
<style>
:root{color-scheme:light;--brand:#3730a3;--navy:#111827;--ink:#1f2328;--muted:#57606a;--line:#e5e7eb;--tint:#eef2ff;--ok:rgb(6 118 71);--warn:rgb(181 71 8);--bad:rgb(180 35 24)}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font:14px/1.55 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#fff}
a{color:var(--brand)}
.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:22px;padding:11px 20px}
.top b{font-size:16px}.top a{color:#fff;text-decoration:none;opacity:.85}.top a.on{opacity:1;border-bottom:2px solid #fff}
main{padding:18px 20px 60px}
h1{font-size:20px;margin:0 0 4px;font-weight:600}h2{font-size:16px;margin:24px 0 8px}h3{font-size:15px;margin:0 0 6px}
.meta{color:var(--muted);font-size:13px;margin:0 0 14px}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:rgb(250 250 250);font-weight:600}
code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;background:rgb(245 245 245);padding:1px 4px;border-radius:3px;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.s-ready .dot,.s-done .dot{background:var(--ok)}.s-starting .dot,.s-waiting .dot{background:var(--warn)}.s-crashed .dot,.s-failed .dot{background:var(--bad)}
.branch{display:inline-block;padding:1px 9px;border-radius:999px;color:#fff;font-weight:600;font-size:13px}
.layout{display:grid;grid-template-columns:330px 1fr;gap:20px;align-items:start}
.list button.row{display:flex;width:100%;justify-content:space-between;gap:8px;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 6px;text-align:left;font:inherit;cursor:pointer;color:inherit}
.list button.row.on{background:var(--tint)}
.sub{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:10px}
.tabs button{border:0;background:none;padding:7px 12px;font:inherit;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--brand)}
.btn{background:var(--brand);color:#fff;border:0;border-radius:4px;padding:6px 12px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
.btn.light{background:#fff;color:var(--brand);border:1px solid var(--brand)}
select{font:inherit;padding:5px 8px;border:1px solid rgb(213 215 218);border-radius:4px}
pre.log{background:rgb(17 24 39);color:rgb(229 231 235);font:12px/1.5 ui-monospace,Menlo,monospace;padding:10px 12px;height:60vh;overflow:auto;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.warn{color:var(--warn)}.was{color:var(--muted);text-decoration:line-through}
.frames{display:grid;gap:12px}.frame{border:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.frame header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);background:rgb(250 250 250);font-size:13px}
.frame iframe{border:0;width:100%;height:68vh;background:#fff}
.tour{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:start}
.steps a{display:block;padding:7px 8px;border-left:3px solid transparent;text-decoration:none;color:var(--ink)}
.steps a.on{border-left-color:var(--brand);background:var(--tint)}
.step p{max-width:820px;margin:6px 0 10px}
.callout{padding:10px 14px;border-left:3px solid var(--brand);background:var(--tint);max-width:820px}
.empty{color:var(--muted);font-style:italic}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
