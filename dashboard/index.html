<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>forkyard</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #16181d;
        --panel: #1c1f26;
        --raised: #232733;
        --text: #d7dae0;
        --muted: #9aa3b2;
        --faint: #737c8c;
        --border: #343a46;
        --accent: #6aa9ff;
        --selected: #23395b;
        --button: #2f3644;
        --match: #7a5a12;
        --ready: #5fd38d;
        --shared: #7dcfff;
        --done: #45c6bd;
        --starting: #f2c14e;
        --waiting: #9aa3b2;
        --restarting: #c49bff;
        --failed: #ff7b7b;
        --mono: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          13.5px/1.5 -apple-system,
          "Segoe UI",
          Roboto,
          Arial,
          sans-serif;
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      button {
        font: inherit;
        color: inherit;
      }
      code {
        font: var(--mono);
        overflow-wrap: anywhere;
      }

      /* frame shared by every view */
      .app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .topbar {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 9px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        white-space: nowrap;
      }
      .topbar .name {
        font-weight: 700;
        color: var(--accent);
      }
      .topbar .totals {
        color: var(--text);
      }
      .topbar .usage {
        color: var(--muted);
      }
      .topbar nav {
        margin-left: auto;
        display: flex;
        gap: 14px;
      }
      .topbar nav a {
        color: var(--muted);
      }
      .topbar nav a.on {
        color: var(--text);
      }
      .page {
        flex: 1;
        min-height: 0;
        padding: 14px 16px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .panel > h2 {
        margin: 0;
        padding: 9px 12px;
        font-size: 13px;
        font-weight: 600;
        border-bottom: 1px solid var(--border);
      }
      .scroll {
        overflow: auto;
        min-height: 0;
      }

      /* tables */
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th {
        text-align: left;
        font-weight: 500;
        font-size: 11.5px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--faint);
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        background: var(--panel);
      }
      td {
        padding: 7px 12px;
        border-bottom: 1px solid #262a33;
        vertical-align: middle;
      }
      tr.clickable {
        cursor: pointer;
      }
      tr.clickable:hover td {
        background: var(--raised);
      }
      td.num {
        font: var(--mono);
        color: var(--text);
      }
      td.dim,
      .dim {
        color: var(--muted);
      }
      .faint {
        color: var(--faint);
      }
      .strong {
        font-weight: 600;
      }

      /* state colors */
      .shared {
        color: var(--shared);
      }
      .c-Ready,
      .c-InfraReady {
        color: var(--ready);
      }
      .c-Done {
        color: var(--done);
      }
      .c-Starting,
      .c-Preparing,
      .c-InfraStarting {
        color: var(--starting);
      }
      .c-Waiting {
        color: var(--waiting);
      }
      .c-Asleep {
        color: var(--muted);
      }
      .c-Restarting {
        color: var(--restarting);
      }
      .c-Failed,
      .c-InfraFailed {
        color: var(--failed);
      }
      .health {
        font: var(--mono);
      }

      /* buttons */
      .button {
        background: var(--button);
        border: 1px solid #3d4556;
        border-radius: 6px;
        padding: 4px 10px;
        cursor: pointer;
        white-space: nowrap;
      }
      .button:hover {
        border-color: var(--accent);
      }
      .button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .button.danger:hover {
        border-color: var(--failed);
        color: var(--failed);
      }

      /* home */
      .home {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: minmax(0, 1fr) 260px;
        gap: 12px;
      }
      .home-side {
        display: grid;
        grid-template-columns: 380px 1fr;
        gap: 12px;
        min-height: 0;
      }
      @media (min-width: 1700px) {
        .home {
          grid-template-columns: minmax(0, 1fr) 560px;
          grid-template-rows: minmax(0, 1fr);
        }
        .home-side {
          grid-template-columns: 1fr;
          grid-template-rows: auto minmax(0, 1fr);
        }
      }
      .home-table {
        min-height: 0;
      }
      .tree .repo + .repo {
        border-top: 1px solid var(--border);
      }
      .repo-head,
      .branch-row {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 7px 12px;
        cursor: pointer;
        white-space: nowrap;
        min-width: 0;
      }
      .repo-head {
        background: var(--raised);
        gap: 12px;
      }
      .repo-head:hover,
      .branch-row:hover {
        background: #283041;
      }
      .repo-head .caret {
        width: 12px;
        color: var(--muted);
      }
      .repo-head .repo-name {
        font-weight: 700;
      }
      .branch-row {
        padding-left: 20px;
        border-top: 1px solid #262a33;
      }
      .branch-row a {
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .branch-label {
        font-weight: 600;
        min-width: 140px;
      }
      .branch-row a.branch-label {
        color: inherit;
        text-decoration: none;
      }
      .repo-toggle {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .repo-toggle:focus-visible,
      .branch-row a.branch-label:focus-visible {
        outline: 2px solid #7aa2f7;
        outline-offset: 2px;
      }
      .stat {
        font: var(--mono);
      }
      .grow {
        flex: 1;
      }
      .button.small {
        padding: 2px 8px;
        font-size: 12px;
      }
      .expander {
        border: 0;
        background: none;
        color: var(--muted);
        cursor: pointer;
        padding: 0 2px;
        width: 14px;
        font-size: 13px;
      }
      .expander:hover {
        color: var(--text);
      }
      .procs {
        display: grid;
        grid-template-columns: 12px minmax(130px, max-content) 76px 40px 40px 52px minmax(0, 1fr) auto;
        column-gap: 12px;
        row-gap: 2px;
        align-items: center;
        padding: 6px 12px 10px 42px;
        background: #191c22;
        font-size: 12.5px;
      }
      .proc {
        display: contents;
      }
      .proc-note {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .infra-row {
        display: flex;
        gap: 8px;
        align-items: baseline;
        padding: 5px 12px;
      }
      .infra-row .name {
        flex: 1;
      }

      /* worktree */
      .wt-header {
        display: flex;
        align-items: center;
        gap: 12px;
        white-space: nowrap;
      }
      .wt-header .stepper {
        display: inline-flex;
        gap: 4px;
      }
      .crumb {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .crumb .repo {
        border: 1px solid;
        border-radius: 6px;
        padding: 1px 8px;
        font-weight: 600;
        font-size: 13px;
      }
      .crumb .sep {
        color: var(--faint);
      }
      .crumb .branch-name {
        font-size: 18px;
        font-weight: 700;
        color: #fff;
      }
      .wt-header .id {
        font-weight: 600;
        font-size: 15px;
      }
      .wt-body {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 300px 1fr;
        gap: 12px;
      }
      .sidebar {
        overflow: auto;
        padding: 6px 0;
      }
      .entry {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        border: 0;
        background: none;
        padding: 5px 12px;
        text-align: left;
        cursor: pointer;
      }
      .entry:hover {
        background: var(--raised);
      }
      .entry.on {
        background: var(--selected);
      }
      .entry .icon {
        width: 14px;
        text-align: center;
      }
      .entry .label {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .entry .state {
        font-size: 12px;
      }
      .entry-group {
        padding: 10px 12px 4px;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--faint);
      }
      .pane-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 12px;
        border-bottom: 1px solid var(--border);
        flex-wrap: wrap;
      }
      .pane-head .title {
        font-weight: 600;
      }
      .pane-head .tools {
        margin-left: auto;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .filter {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 8px;
        color: var(--text);
        width: 200px;
        font: inherit;
      }
      .filter:focus {
        outline: none;
        border-color: var(--starting);
      }
      select {
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 6px;
        font: inherit;
      }
      .logview {
        flex: 1;
        min-height: 0;
        overflow: auto;
        margin: 0;
        padding: 8px 12px;
        font: var(--mono);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .logview .key {
        display: inline-block;
        width: 150px;
        overflow: hidden;
        text-overflow: ellipsis;
        vertical-align: bottom;
        white-space: nowrap;
      }
      .logview .separator {
        color: var(--faint);
      }
      mark {
        background: var(--match);
        color: #fff4d6;
        border-radius: 2px;
      }

      /* kept for the tour page */
      main {
        padding: 18px 20px 60px;
        overflow: auto;
      }
      h1 {
        font-size: 19px;
        margin: 0 0 4px;
        font-weight: 600;
      }
      h3 {
        font-size: 14px;
        margin: 0 0 6px;
      }
      .meta,
      .sub {
        color: var(--muted);
        font-size: 12.5px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 2px 10px;
        font-size: 12.5px;
        white-space: nowrap;
        color: var(--text);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
      }
      .s-ready .dot,
      .s-done .dot {
        background: var(--ready);
      }
      .s-starting .dot,
      .s-waiting .dot,
      .s-preparing .dot,
      .s-restarting .dot {
        background: var(--starting);
      }
      .s-failed .dot {
        background: var(--failed);
      }
      .branch {
        display: inline-block;
        padding: 1px 9px;
        border-radius: 999px;
        color: #fff;
        font-weight: 600;
        font-size: 12.5px;
      }
      .btn {
        background: var(--button);
        color: var(--text);
        border: 1px solid #3d4556;
        border-radius: 6px;
        padding: 5px 11px;
        cursor: pointer;
        display: inline-block;
      }
      .btn.light {
        background: transparent;
      }
      pre.log {
        background: var(--bg);
        border: 1px solid var(--border);
        font: var(--mono);
        padding: 10px 12px;
        height: 55vh;
        overflow: auto;
        margin: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .warn {
        color: var(--starting);
      }
      .was {
        color: var(--muted);
        text-decoration: line-through;
      }
      .frames {
        display: grid;
        gap: 12px;
      }
      .frame {
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .frame header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        font-size: 12.5px;
      }
      .frame iframe {
        border: 0;
        width: 100%;
        height: 68vh;
        background: #fff;
      }
      .tour {
        display: grid;
        grid-template-columns: 260px 1fr;
        gap: 20px;
        align-items: start;
      }
      .steps a {
        display: block;
        padding: 7px 8px;
        border-left: 3px solid transparent;
        color: var(--text);
      }
      .steps a.on {
        border-left-color: var(--accent);
        background: var(--selected);
      }
      .step p {
        max-width: 820px;
        margin: 6px 0 10px;
      }
      .callout {
        padding: 10px 14px;
        border-left: 3px solid var(--accent);
        background: var(--panel);
        max-width: 820px;
      }
      .empty {
        color: var(--muted);
        font-style: italic;
        padding: 10px 12px;
      }
      .tabs {
        display: flex;
        gap: 4px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 10px;
      }
      .tabs button {
        border: 0;
        background: none;
        padding: 7px 12px;
        cursor: pointer;
        color: var(--muted);
        border-bottom: 2px solid transparent;
      }
      .tabs button.on {
        color: var(--text);
        border-bottom-color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
